<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>
html,body{background:#000;color:#fff;margin:0;height:100%;font:30px Arial,sans-serif}video{position:absolute;width:100%;height:100%;object-fit:contain}#start{position:absolute;z-index:5;left:32%;top:42%;font-size:38px;padding:30px;background:#263d70;color:#fff;border:4px solid #9bf7ed;border-radius:18px}#overlay{position:absolute;left:4%;right:4%;bottom:5%;padding:25px;background:rgba(8,15,30,.9);border-radius:18px}button{font-size:28px;padding:14px 24px;margin-right:14px;border:4px solid transparent;border-radius:12px;background:#253653;color:white}button:focus{border-color:#9ef5ef;outline:none}#status{position:absolute;top:5%;left:5%;background:#142037;padding:12px;border-radius:12px;font-size:24px}#jump-dialog{position:absolute;z-index:6;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center}#jump-card{max-width:1300px;padding:35px;background:#18243c;border-radius:20px}#jump-card h2{margin:0 0 18px;font-size:40px}#jump-card p{margin:15px 0;font-size:26px}#jump-fields{display:flex;align-items:center;margin:14px 0}#jump-fields button{min-width:180px}#jump-actions button{margin-top:10px}*[hidden]{display:none!important}
</style></head><body><video id="video" playsinline></video><button id="start">Нажмите OK — VK ×2</button><div id="status" hidden></div><section id="overlay" hidden><p id="time"></p><button id="pause">Пауза</button><button id="back10">−10 сек</button><button id="forward10">+10 сек</button><button id="jump-open">Перейти ко времени</button><button id="speed">Скорость: 2×</button><button id="quality">Качество: Авто</button><button id="hide">Скрыть меню</button><button id="return">Вернуться в VK</button></section><section id="jump-dialog" role="dialog" aria-modal="true" aria-labelledby="jump-heading" hidden><div id="jump-card"><h2 id="jump-heading">Перейти ко времени</h2><p>← → выбор · ↑ ↓ изменить · «Перейти» подтвердить</p><div id="jump-fields"><button id="jump-hours">Часы: 0</button><button id="jump-minutes">Минуты: 00</button><button id="jump-seconds">Секунды: 00</button></div><p id="jump-preview"></p><div id="jump-actions"><button id="jump-back">−10 минут</button><button id="jump-forward">+10 минут</button><button id="jump-confirm">Перейти</button><button id="jump-cancel">Отмена</button></div></div></section><script src="vendor/hls.light.min.js"></script><script src="player.js"></script></body></html>
